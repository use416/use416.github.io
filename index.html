<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>use4'16 | Moda Infantil e Juvenil (4 ao 16)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-page: #FAF8F5;
      --text-main: #1B2A4A;
      --text-muted: #5C667A;
      
      /* Paleta dos 3 Mundos */
      --kids-primary: #1B2A4A;
      --kids-accent: #E06D53;
      --kids-soft: #FDECE8;

      --preteen-primary: #232B28;
      --preteen-accent: #769F81;
      --preteen-soft: #EAF2EC;

      --teen-primary: #2C3E50;
      --teen-accent: #D49A3B;
      --teen-soft: #FDF5E6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Cabeçalho */
    header {
      background-color: #FFFFFF;
      border-bottom: 1px solid #EAE6DF;
      padding: 24px 16px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      letter-spacing: -1px;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .logo .tag-apostrophe {
      color: #E06D53;
      margin: 0 1px;
    }

    .subtitle {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Filtros de Setor (Mundos) */
    .filters-container {
      max-width: 1100px;
      margin: 20px auto 10px;
      padding: 0 16px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      justify-content: center;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 2px solid #E2DDD5;
      background: #FFFFFF;
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .filter-btn:hover {
      transform: translateY(-1px);
    }

    .filter-btn.active[data-filter="Todos"] {
      background: var(--text-main);
      color: #FFF;
      border-color: var(--text-main);
    }

    .filter-btn.active[data-filter="Kids"] {
      background: var(--kids-accent);
      color: #FFF;
      border-color: var(--kids-accent);
    }

    .filter-btn.active[data-filter="Pre-Teen"] {
      background: var(--preteen-accent);
      color: #FFF;
      border-color: var(--preteen-accent);
    }

    .filter-btn.active[data-filter="Teen"] {
      background: var(--teen-accent);
      color: #FFF;
      border-color: var(--teen-accent);
    }

    /* Barra de Busca por Tamanho */
    .size-filter-bar {
      max-width: 1100px;
      margin: 10px auto 24px;
      padding: 0 16px;
      text-align: center;
    }

    .size-filter-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    .size-pills {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .size-pill {
      background: #EFECE6;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .size-pill.active {
      background: var(--text-main);
      color: #FFF;
    }

    /* Grade de Produtos */
    .catalog-grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #EAE6DF;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(27, 42, 74, 0.08);
    }

    .product-image-wrap {
      position: relative;
      width: 100%;
      padding-top: 115%;
      background-color: #F2EFE9;
      overflow: hidden;
    }

    .product-image-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mundo-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .mundo-Kids { background: var(--kids-soft); color: var(--kids-accent); }
    .mundo-Pre-Teen { background: var(--preteen-soft); color: var(--preteen-accent); }
    .mundo-Teen { background: var(--teen-soft); color: var(--teen-accent); }

    .product-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .product-price {
      font-weight: 700;
      font-size: 1.2rem;
      color: #1B2A4A;
      margin-bottom: 14px;
    }

    .sizes-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
    }

    .sizes-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }

    .size-btn {
      min-width: 38px;
      height: 36px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1.5px solid #D5CFC5;
      background: #FFF;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .size-btn:hover:not(:disabled) {
      border-color: var(--text-main);
    }

    .size-btn.selected {
      background: var(--text-main);
      color: #FFF;
      border-color: var(--text-main);
    }

    .size-btn:disabled {
      background: #F4F2EE;
      color: #B5AFA6;
      border-color: #E6E2DA;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    .whatsapp-btn {
      margin-top: auto;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: #25D366;
      color: #FFFFFF;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease;
    }

    .whatsapp-btn:hover {
      background-color: #1EBE5D;
    }

    .whatsapp-btn.sold-out {
      background-color: #D5CFC5;
      color: #6E6A63;
      cursor: not-allowed;
    }

    /* Botão Flutuante de Dúvidas / Medidas */
    .floating-help {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--text-main);
      color: #FFF;
      padding: 12px 18px;
      border-radius: 50px;
      text-decoration: none;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.88rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      z-index: 99;
    }

    .status-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-weight: 600;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">use4<span class="tag-apostrophe">'</span>16</div>
    <div class="subtitle">Moda do 4 ao 16</div>
  </header>

  <!-- Filtro por Setor / Mundo -->
  <div class="filters-container">
    <button class="filter-btn active" data-filter="Todos">Todos os Mundos</button>
    <button class="filter-btn" data-filter="Kids">Mundo Kids (4-8)</button>
    <button class="filter-btn" data-filter="Pre-Teen">Pré-Teen (9-12)</button>
    <button class="filter-btn" data-filter="Teen">Mundo Teen (13-16)</button>
  </div>

  <!-- Filtro Rápido por Tamanho -->
  <div class="size-filter-bar">
    <span class="size-filter-label">Filtrar por tamanho disponível:</span>
    <div class="size-pills" id="sizePills">
      <button class="size-pill active" data-size="Todos">Todos</button>
      <button class="size-pill" data-size="4">4</button>
      <button class="size-pill" data-size="6">6</button>
      <button class="size-pill" data-size="8">8</button>
      <button class="size-pill" data-size="10">10</button>
      <button class="size-pill" data-size="12">12</button>
      <button class="size-pill" data-size="14">14</button>
      <button class="size-pill" data-size="16">16</button>
    </div>
  </div>

  <!-- Vitrine de Produtos -->
  <main class="catalog-grid" id="catalogGrid">
    <div class="status-msg">Carregando peças da use4'16...</div>
  </main>

  <!-- Botão Flutuante Atendimento Geral -->
  <a href="#" id="floatingWhatsapp" class="floating-help" target="_blank">
    💬 Dúvidas sobre tamanhos?
  </a>

  <script>
    // =========================================================================
    // CONFIGURAÇÕES DA LOJA (EDITE AQUI QUANDO PRECISAR)
    // =========================================================================
    const CONFIG = {
      // Número do WhatsApp com código do país (55) + DDD + número (apenas dígitos)
      whatsappNumber: "5582996933636",
      
      // Link .csv gerado no Google Sheets
      googleSheetsCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQPcYZvH8TbGD0Eto58Ckd5ubrVLeGFU_yra-EoQdNIAiC_vVLQ-7Q_0tIQzEMOf96Thj4Nlfq4P6io/pub?output=csv" 
    };
    // =========================================================================

    const SIZES = ["4", "6", "8", "10", "12", "14", "16"];
    let allProducts = [];
    let currentMundo = "Todos";
    let currentSize = "Todos";

    // Atualiza o botão flutuante com o número configurado
    document.getElementById("floatingWhatsapp").href = 
      `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent("Olá! Vim pelo catálogo da use4'16 e preciso de ajuda com os tamanhos.")}`;

    // Conversor de CSV para objetos JavaScript
    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
      
      return lines.slice(1).map(line => {
        const values = [];
        let current = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            values.push(current.trim());
            current = "";
          } else {
            current += char;
          }
        }
        values.push(current.trim());

        const row = {};
        headers.forEach((header, i) => {
          row[header] = values[i] || "";
        });

        return {
          ID: row.ID || "",
          Nome: row.Nome || "Peça sem nome",
          Mundo: row.Mundo || "Kids",
          Preco: row.Preco || "0,00",
          Foto_URL: row.Foto_URL || "https://via.placeholder.com/400x500?text=use4'16",
          estoque: {
            "4": parseInt(row.Tam_4) || 0,
            "6": parseInt(row.Tam_6) || 0,
            "8": parseInt(row.Tam_8) || 0,
            "10": parseInt(row.Tam_10) || 0,
            "12": parseInt(row.Tam_12) || 0,
            "14": parseInt(row.Tam_14) || 0,
            "16": parseInt(row.Tam_16) || 0
          }
        };
      }).filter(item => item.Nome && item.Nome !== "Peça sem nome");
    }

    async function loadProducts() {
      try {
        const separator = CONFIG.googleSheetsCsvUrl.includes("?") ? "&" : "?";
        const urlWithCacheBust = `${CONFIG.googleSheetsCsvUrl}${separator}t=${new Date().getTime()}`;
        const response = await fetch(urlWithCacheBust);
        const csvData = await response.text();
        allProducts = parseCSV(csvData);
        renderCatalog();
      } catch (error) {
        document.getElementById("catalogGrid").innerHTML = 
          `<div class="status-msg">Erro ao carregar o estoque. Verifique sua conexão ou o link da planilha.</div>`;
      }
    }

    function renderCatalog() {
      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = "";

      if (allProducts.length === 0) {
        grid.innerHTML = `<div class="status-msg">Nenhuma peça cadastrada na planilha ainda. Adicione produtos a partir da linha 2 do Google Sheets!</div>`;
        return;
      }

      const filtered = allProducts.filter(item => {
        const matchMundo = currentMundo === "Todos" || item.Mundo.toLowerCase() === currentMundo.toLowerCase();
        const matchSize = currentSize === "Todos" || (item.estoque[currentSize] && item.estoque[currentSize] > 0);
        return matchMundo && matchSize;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="status-msg">Nenhuma peça encontrada com esse filtro no momento.</div>`;
        return;
      }

      filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "product-card";

        const availableSizes = SIZES.filter(s => product.estoque[s] > 0);
        const isCompletelySoldOut = availableSizes.length === 0;

        let mundoLabel = "Mundo Kids";
        if (product.Mundo === "Pre-Teen") mundoLabel = "Mundo Pré-Teen";
        if (product.Mundo === "Teen") mundoLabel = "Mundo Teen";

        const sizesHtml = SIZES.map(size => {
          const qty = product.estoque[size] || 0;
          const disabledAttr = qty <= 0 ? "disabled" : "";
          return `<button type="button" class="size-btn" data-size="${size}" ${disabledAttr}>${size}</button>`;
        }).join("");

        card.innerHTML = `
          <div class="product-image-wrap">
            <img src="${product.Foto_URL}" alt="${product.Nome}" loading="lazy" />
            <span class="mundo-badge mundo-${product.Mundo}">${mundoLabel}</span>
          </div>
          <div class="product-info">
            <h2 class="product-title">${product.Nome}</h2>
            <div class="product-price">R$ ${product.Preco}</div>
            <span class="sizes-label">Selecione o tamanho disponível:</span>
            <div class="sizes-grid">${sizesHtml}</div>
            <button type="button" class="whatsapp-btn ${isCompletelySoldOut ? 'sold-out' : ''}" ${isCompletelySoldOut ? 'disabled' : ''}>
              ${isCompletelySoldOut ? 'Peça Esgotada' : 'Pedir no WhatsApp'}
            </button>
          </div>
        `;

        let selectedSize = null;
        const sizeButtons = card.querySelectorAll(".size-btn:not(:disabled)");
        
        sizeButtons.forEach(btn => {
          btn.addEventListener("click", () => {
            sizeButtons.forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedSize = btn.getAttribute("data-size");
          });
        });

        const orderBtn = card.querySelector(".whatsapp-btn");
        if (!isCompletelySoldOut) {
          orderBtn.addEventListener("click", () => {
            if (!selectedSize) {
              alert("Por favor, selecione um tamanho disponível antes de pedir!");
              return;
            }
            const text = `Olá! Vim pelo catálogo da *use4'16* e gostaria de encomendar:\n\n• *Peça:* ${product.Nome} (Cód: ${product.ID})\n• *Tamanho:* ${selectedSize}\n• *Valor:* R$ ${product.Preco}\n\nAinda está disponível?`;
            const waUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`;
            window.open(waUrl, "_blank");
          });
        }

        grid.appendChild(card);
      });
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentMundo = btn.getAttribute("data-filter");
        renderCatalog();
      });
    });

    document.querySelectorAll(".size-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        document.querySelectorAll(".size-pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        currentSize = pill.getAttribute("data-size");
        renderCatalog();
      });
    });

    loadProducts();
  </script>
</body>
</html>
