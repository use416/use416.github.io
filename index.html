<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>use4'16 | Moda Infantil e Juvenil (4 ao 16)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-page: #FAF8F5;
      --text-main: #1B2A4A;
      --text-muted: #5C667A;
      
      /* Paleta dos 3 Mundos */
      --kids-primary: #1B2A4A;
      --kids-accent: #E06D53;
      --kids-soft: #FDECE8;

      --preteen-primary: #232B28;
      --preteen-accent: #769F81;
      --preteen-soft: #EAF2EC;

      --teen-primary: #2C3E50;
      --teen-accent: #D49A3B;
      --teen-soft: #FDF5E6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Cabeçalho */
    header {
      background-color: #FFFFFF;
      border-bottom: 1px solid #EAE6DF;
      padding: 24px 16px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      letter-spacing: -1px;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .logo .tag-apostrophe {
      color: #E06D53;
      margin: 0 1px;
    }

    .subtitle {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Faixa VIP Captação de Leads */
    .vip-banner {
      max-width: 1100px;
      margin: 20px auto 10px;
      padding: 0 16px;
    }

    .vip-card {
      background: linear-gradient(135deg, #1B2A4A 0%, #2C3E50 100%);
      color: #FFFFFF;
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 8px 20px rgba(27, 42, 74, 0.12);
    }

    .vip-text h3 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.15rem;
      margin-bottom: 2px;
    }

    .vip-text p {
      font-size: 0.85rem;
      color: #DCE3F0;
    }

    .vip-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex-grow: 1;
      justify-content: flex-end;
    }

    .vip-form input, .vip-form select {
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }

    .vip-form input[name="nome"] { width: 150px; }
    .vip-form input[name="whatsapp"] { width: 160px; }
    .vip-form select { width: 115px; background: #FFF; color: var(--text-main); font-weight: 600; }

    .vip-submit-btn {
      background-color: #E06D53;
      color: #FFF;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .vip-submit-btn:hover { background-color: #C95B42; }

    .vip-feedback {
      width: 100%;
      font-size: 0.85rem;
      font-weight: 700;
      color: #A3E4D7;
      text-align: right;
      display: none;
    }

    .vip-coupon-box {
      display: inline-block;
      background: #FFFFFF;
      color: #1B2A4A;
      padding: 2px 10px;
      border-radius: 6px;
      font-weight: 900;
      letter-spacing: 1px;
      margin: 0 4px;
    }

    /* Filtros de Setor (Mundos) */
    .filters-container {
      max-width: 1100px;
      margin: 20px auto 10px;
      padding: 0 16px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      justify-content: center;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 2px solid #E2DDD5;
      background: #FFFFFF;
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .filter-btn:hover { transform: translateY(-1px); }

    .filter-btn.active[data-filter="Todos"] {
      background: var(--text-main);
      color: #FFF;
      border-color: var(--text-main);
    }

    .filter-btn.active[data-filter="Kids"] {
      background: var(--kids-accent);
      color: #FFF;
      border-color: var(--kids-accent);
    }

    .filter-btn.active[data-filter="Pre-Teen"] {
      background: var(--preteen-accent);
      color: #FFF;
      border-color: var(--preteen-accent);
    }

    .filter-btn.active[data-filter="Teen"] {
      background: var(--teen-accent);
      color: #FFF;
      border-color: var(--teen-accent);
    }

    /* Barra de Busca por Tamanho */
    .size-filter-bar {
      max-width: 1100px;
      margin: 10px auto 24px;
      padding: 0 16px;
      text-align: center;
    }

    .size-filter-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    .size-pills {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .size-pill {
      background: #EFECE6;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .size-pill.active {
      background: var(--text-main);
      color: #FFF;
    }

    /* Grade de Produtos */
    .catalog-grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #EAE6DF;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(27, 42, 74, 0.08);
    }

    .product-image-wrap {
      position: relative;
      width: 100%;
      padding-top: 115%;
      background-color: #F2EFE9;
      overflow: hidden;
    }

    .product-image-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Setas e contador de múltiplas fotos */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: 900;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: background 0.15s ease;
    }

    .carousel-btn:hover { background: #FFFFFF; }
    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }

    .photo-counter {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(27, 42, 74, 0.75);
      color: #FFF;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      z-index: 10;
    }

    .mundo-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 10;
    }

    .mundo-Kids { background: var(--kids-soft); color: var(--kids-accent); }
    .mundo-Pre-Teen { background: var(--preteen-soft); color: var(--preteen-accent); }
    .mundo-Teen { background: var(--teen-soft); color: var(--teen-accent); }

    /* Etiqueta de Promoção / Novidade */
    .promo-tag-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 10;
      background-color: #E06D53;
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .promo-tag-badge.tag-novidade {
      background-color: #1B2A4A;
      color: #FFFFFF;
    }

    .promo-tag-badge.tag-oferta,
    .promo-tag-badge.tag-promocao {
      background-color: #D9383A;
      color: #FFFFFF;
    }

    .product-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .price-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .product-old-price {
      font-size: 0.9rem;
      font-weight: 600;
      color: #8C95A6;
      text-decoration: line-through;
    }

    .product-price {
      font-weight: 800;
      font-size: 1.25rem;
      color: #1B2A4A;
    }

    .product-price.has-discount {
      color: #D9383A;
    }

    .sizes-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
    }

    .sizes-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }

    .size-btn {
      min-width: 38px;
      height: 36px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1.5px solid #D5CFC5;
      background: #FFF;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .size-btn:hover { border-color: var(--text-main); }

    .size-btn.selected {
      background: var(--text-main);
      color: #FFF;
      border-color: var(--text-main);
    }

    .size-btn.out-of-stock {
      background: #F4F2EE;
      color: #9E988E;
      border: 1.5px dashed #CFC9BE;
      text-decoration: line-through;
    }

    .size-btn.out-of-stock.selected {
      background: #E06D53;
      color: #FFF;
      border: 1.5px solid #E06D53;
      text-decoration: none;
    }

    .whatsapp-btn {
      margin-top: auto;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: #25D366;
      color: #FFFFFF;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease;
    }

    .whatsapp-btn:hover { background-color: #1EBE5D; }

    .whatsapp-btn.notify-mode {
      background-color: #E06D53;
      color: #FFFFFF;
    }

    .whatsapp-btn.notify-mode:hover { background-color: #C95B42; }

    /* Modal de Captura de Lead antes do WhatsApp / Lista de Espera */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(27, 42, 74, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #FFFFFF;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.2);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .modal-box h3 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.25rem;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .modal-box p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .modal-field {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #D5CFC5;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.92rem;
      margin-bottom: 10px;
      outline: none;
    }

    .modal-field:focus { border-color: var(--text-main); }

    .modal-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #25D366;
      color: #FFF;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 4px;
    }

    .modal-submit.notify-submit { background: #E06D53; }

    /* Botão Flutuante de Dúvidas / Medidas */
    .floating-help {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--text-main);
      color: #FFF;
      padding: 12px 18px;
      border-radius: 50px;
      text-decoration: none;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.88rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      z-index: 99;
    }

    .status-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-weight: 600;
      grid-column: 1 / -1;
    }

    @media (max-width: 680px) {
      .vip-form { justify-content: stretch; }
      .vip-form input[name="nome"],
      .vip-form input[name="whatsapp"],
      .vip-form select,
      .vip-submit-btn { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">use4<span class="tag-apostrophe">'</span>16</div>
    <div class="subtitle">Moda do 4 ao 16</div>
  </header>

  <!-- Opção 1: Faixa Lista VIP no Topo -->
  <section class="vip-banner">
    <div class="vip-card">
      <div class="vip-text">
        <h3>✨ Lista VIP use4'16</h3>
        <p>Receba <strong>CUPONS</strong>, novidades e promoções exclusivas no tamanho ideal direto no seu WhatsApp!</p>
      </div>
      <form class="vip-form" id="vipForm">
        <input type="text" name="nome" placeholder="Seu nome" required />
        <input type="tel" name="whatsapp" placeholder="WhatsApp (DDD + número)" required />
        <select name="tamanho" required>
          <option value="">Tamanho...</option>
          <option value="4">Tam. 4</option>
          <option value="6">Tam. 6</option>
          <option value="8">Tam. 8</option>
          <option value="10">Tam. 10</option>
          <option value="12">Tam. 12</option>
          <option value="14">Tam. 14</option>
          <option value="16">Tam. 16</option>
        </select>
        <button type="submit" class="vip-submit-btn">Entrar na Lista VIP</button>
        <div class="vip-feedback" id="vipFeedback"></div>
      </form>
    </div>
  </section>

  <!-- Filtro por Setor / Mundo -->
  <div class="filters-container">
    <button class="filter-btn active" data-filter="Todos">Todos os Mundos</button>
    <button class="filter-btn" data-filter="Kids">Mundo Kids (4-8)</button>
    <button class="filter-btn" data-filter="Pre-Teen">Pré-Teen (9-12)</button>
    <button class="filter-btn" data-filter="Teen">Mundo Teen (13-16)</button>
  </div>

  <!-- Filtro Rápido por Tamanho -->
  <div class="size-filter-bar">
    <span class="size-filter-label">Filtrar por tamanho disponível:</span>
    <div class="size-pills" id="sizePills">
      <button class="size-pill active" data-size="Todos">Todos</button>
      <button class="size-pill" data-size="4">4</button>
      <button class="size-pill" data-size="6">6</button>
      <button class="size-pill" data-size="8">8</button>
      <button class="size-pill" data-size="10">10</button>
      <button class="size-pill" data-size="12">12</button>
      <button class="size-pill" data-size="14">14</button>
      <button class="size-pill" data-size="16">16</button>
    </div>
  </div>

  <!-- Vitrine de Produtos -->
  <main class="catalog-grid" id="catalogGrid">
    <div class="status-msg">Carregando peças da use4'16...</div>
  </main>

  <!-- Modal Opções 2 e 3: Captura antes do WhatsApp ou Lista de Espera -->
  <div class="modal-overlay" id="leadModal">
    <div class="modal-box">
      <button type="button" class="modal-close" id="closeModalBtn">&times;</button>
      <h3 id="modalTitle">Quase lá!</h3>
      <p id="modalDesc">Informe seu nome e WhatsApp para continuar seu pedido.</p>
      <form id="modalLeadForm">
        <input type="text" class="modal-field" id="modalNome" placeholder="Seu nome" required />
        <input type="tel" class="modal-field" id="modalWhatsapp" placeholder="Seu WhatsApp (com DDD)" required />
        <input type="text" class="modal-field" id="modalCupom" placeholder="Tem cupom de desconto? (Opcional)" style="text-transform: uppercase;" />
        <button type="submit" class="modal-submit" id="modalSubmitBtn">Continuar para o WhatsApp</button>
      </form>
    </div>
  </div>

  <!-- Botão Flutuante Atendimento Geral -->
  <a href="#" id="floatingWhatsapp" class="floating-help" target="_blank">
    💬 Dúvidas sobre tamanhos?
  </a>

  <script>
    // =========================================================================
    // CONFIGURAÇÕES DA LOJA (EDITE AQUI QUANDO PRECISAR)
    // =========================================================================
    const CONFIG = {
      // Número do WhatsApp com código do país (55) + DDD + número (apenas dígitos)
      whatsappNumber: "5582996933636",
      
      // Link .csv gerado no Google Sheets (LÊ OS PRODUTOS)
      googleSheetsCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQPcYZvH8TbGD0Eto58Ckd5ubrVLeGFU_yra-EoQdNIAiC_vVLQ-7Q_0tIQzEMOf96Thj4Nlfq4P6io/pub?output=csv",

      // Link do Google Apps Script (SALVA OS LEADS NA ABA 'Leads')
      googleAppsScriptUrl: "https://script.google.com/macros/s/AKfycbyFfidp6vRVMJSag3b3SpemlNU6yEnVoho9HOkvFyLfR61_n_4GVk6z4rGAsPjrPQqM/exec",

      // Cupom exibido automaticamente após cadastro na Lista VIP (deixe "" se não quiser)
      cupomListaVip: "VIP10"
    };
    // =========================================================================

    const SIZES = ["4", "6", "8", "10", "12", "14", "16"];
    let allProducts = [];
    let currentMundo = "Todos";
    let currentSize = "Todos";
    let pendingAction = null;

    document.getElementById("floatingWhatsapp").href = 
      `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent("Olá! Vim pelo catálogo da use4'16 e preciso de ajuda com os tamanhos.")}`;

    // Função para enviar lead ao Google Sheets
    async function saveLeadToSheets(payload) {
      if (!CONFIG.googleAppsScriptUrl) return;
      try {
        await fetch(CONFIG.googleAppsScriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Erro ao registrar lead:", err);
      }
    }

    // Opção 1: Envio da Lista VIP no Topo
    document.getElementById("vipForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const nome = form.nome.value.trim();
      const whatsapp = form.whatsapp.value.trim();
      const tamanho = form.tamanho.value;
      const feedback = document.getElementById("vipFeedback");

      localStorage.setItem("use416_lead_nome", nome);
      localStorage.setItem("use416_lead_whats", whatsapp);

      await saveLeadToSheets({
        tipo: "Lista VIP",
        nome: nome,
        whatsapp: whatsapp,
        peca: "Cadastro VIP",
        tamanho: tamanho
      });

      form.reset();
      feedback.style.display = "block";
      if (CONFIG.cupomListaVip) {
        feedback.innerHTML = `✅ Cadastro confirmado! Use o cupom <span class="vip-coupon-box">${CONFIG.cupomListaVip}</span> no pedido para ganhar desconto!`;
      } else {
        feedback.textContent = "✅ Você entrou na Lista VIP use4'16! Avisaremos quando chegarem novidades no seu tamanho.";
      }
    });

    // Controle do Modal (Opções 2 e 3)
    const leadModal = document.getElementById("leadModal");
    const modalNomeInput = document.getElementById("modalNome");
    const modalWhatsInput = document.getElementById("modalWhatsapp");
    const modalCupomInput = document.getElementById("modalCupom");

    function openLeadModal(actionData) {
      pendingAction = actionData;
      const savedNome = localStorage.getItem("use416_lead_nome") || "";
      const savedWhats = localStorage.getItem("use416_lead_whats") || "";
      modalNomeInput.value = savedNome;
      modalWhatsInput.value = savedWhats;
      modalCupomInput.value = "";

      const titleEl = document.getElementById("modalTitle");
      const descEl = document.getElementById("modalDesc");
      const submitBtn = document.getElementById("modalSubmitBtn");

      if (actionData.mode === "notify") {
        titleEl.textContent = "Avise-me quando chegar";
        descEl.textContent = `Deixe seu contato para avisarmos assim que o tamanho ${actionData.size} da peça "${actionData.product.Nome}" voltar ao estoque.`;
        submitBtn.textContent = "Salvar na Lista de Espera";
        submitBtn.classList.add("notify-submit");
        modalCupomInput.style.display = "none";
      } else {
        titleEl.textContent = "Quase lá!";
        descEl.textContent = "Informe seu nome e WhatsApp para agilizar seu atendimento.";
        submitBtn.textContent = "Continuar para o WhatsApp";
        submitBtn.classList.remove("notify-submit");
        modalCupomInput.style.display = "block";
      }

      leadModal.classList.add("open");
    }

    document.getElementById("closeModalBtn").addEventListener("click", () => {
      leadModal.classList.remove("open");
    });

    leadModal.addEventListener("click", (e) => {
      if (e.target === leadModal) leadModal.classList.remove("open");
    });

    document.getElementById("modalLeadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!pendingAction) return;

      const nome = modalNomeInput.value.trim();
      const whatsapp = modalWhatsInput.value.trim();
      const cupom = modalCupomInput.value.trim().toUpperCase();

      localStorage.setItem("use416_lead_nome", nome);
      localStorage.setItem("use416_lead_whats", whatsapp);

      const { mode, product, size } = pendingAction;

      if (mode === "notify") {
        await saveLeadToSheets({
          tipo: "Lista de Espera (Esgotado)",
          nome: nome,
          whatsapp: whatsapp,
          peca: `${product.Nome} (Cód: ${product.ID})`,
          tamanho: size
        });
        leadModal.classList.remove("open");
        alert(`Pronto, ${nome}! Assim que o tamanho ${size} chegar, entraremos em contato pelo WhatsApp.`);
      } else {
        await saveLeadToSheets({
          tipo: cupom ? `Pedido WhatsApp (Cupom: ${cupom})` : "Pedido WhatsApp",
          nome: nome,
          whatsapp: whatsapp,
          peca: `${product.Nome} (Cód: ${product.ID})`,
          tamanho: size
        });
        leadModal.classList.remove("open");
        const cupomTexto = cupom ? `
• *Cupom informado:* ${cupom}` : "";
        const text = `Olá! Meu nome é *${nome}*, vim pelo catálogo da *use4'16* e gostaria de encomendar:

• *Peça:* ${product.Nome} (Cód: ${product.ID})
• *Tamanho:* ${size}
• *Valor:* R$ ${product.Preco}${cupomTexto}

Ainda está disponível?`;
        const waUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`;
        window.open(waUrl, "_blank");
      }
    });

    // Conversor de CSV para objetos JavaScript
    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
      
      return lines.slice(1).map(line => {
        const values = [];
        let current = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            values.push(current.trim());
            current = "";
          } else {
            current += char;
          }
        }
        values.push(current.trim());

        const row = {};
        headers.forEach((header, i) => {
          row[header] = values[i] || "";
        });

        const rawFotos = row.Foto_URL ? row.Foto_URL.split(",").map(u => u.trim()).filter(Boolean) : [];
        const fotos = rawFotos.length > 0 ? rawFotos : ["https://via.placeholder.com/400x500?text=use4'16"];

        return {
          ID: row.ID || "",
          Nome: row.Nome || "Peça sem nome",
          Mundo: row.Mundo || "Kids",
          Preco: row.Preco || "0,00",
          Preco_Antigo: row.Preco_Antigo ? row.Preco_Antigo.trim() : "",
          Tag: row.Tag ? row.Tag.trim() : "",
          Fotos: fotos,
          estoque: {
            "4": parseInt(row.Tam_4) || 0,
            "6": parseInt(row.Tam_6) || 0,
            "8": parseInt(row.Tam_8) || 0,
            "10": parseInt(row.Tam_10) || 0,
            "12": parseInt(row.Tam_12) || 0,
            "14": parseInt(row.Tam_14) || 0,
            "16": parseInt(row.Tam_16) || 0
          }
        };
      }).filter(item => item.Nome && item.Nome !== "Peça sem nome");
    }

    async function loadProducts() {
      try {
        const separator = CONFIG.googleSheetsCsvUrl.includes("?") ? "&" : "?";
        const urlWithCacheBust = `${CONFIG.googleSheetsCsvUrl}${separator}t=${new Date().getTime()}`;
        const response = await fetch(urlWithCacheBust);
        const csvData = await response.text();
        allProducts = parseCSV(csvData);
        renderCatalog();
      } catch (error) {
        document.getElementById("catalogGrid").innerHTML = 
          `<div class="status-msg">Erro ao carregar o estoque. Verifique sua conexão ou o link da planilha.</div>`;
      }
    }

    function renderCatalog() {
      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = "";

      if (allProducts.length === 0) {
        grid.innerHTML = `<div class="status-msg">Nenhuma peça cadastrada na planilha ainda. Adicione produtos a partir da linha 2 do Google Sheets!</div>`;
        return;
      }

      const filtered = allProducts.filter(item => {
        const matchMundo = currentMundo === "Todos" || item.Mundo.toLowerCase() === currentMundo.toLowerCase();
        const matchSize = currentSize === "Todos" || (item.estoque[currentSize] && item.estoque[currentSize] > 0);
        return matchMundo && matchSize;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="status-msg">Nenhuma peça encontrada com esse filtro no momento.</div>`;
        return;
      }

      filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "product-card";

        let mundoLabel = "Mundo Kids";
        if (product.Mundo === "Pre-Teen") mundoLabel = "Mundo Pré-Teen";
        if (product.Mundo === "Teen") mundoLabel = "Mundo Teen";

        const sizesHtml = SIZES.map(size => {
          const qty = product.estoque[size] || 0;
          const outClass = qty <= 0 ? "out-of-stock" : "";
          return `<button type="button" class="size-btn ${outClass}" data-size="${size}" data-qty="${qty}">${size}</button>`;
        }).join("");

        let currentPhotoIndex = 0;
        const hasMultiplePhotos = product.Fotos.length > 1;

        // Etiqueta opcional (Novidade / Promoção / Oferta)
        let tagHtml = "";
        if (product.Tag) {
          const normalizedTag = product.Tag.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          let extraTagClass = "";
          if (normalizedTag.includes("novidade")) extraTagClass = "tag-novidade";
          if (normalizedTag.includes("promo") || normalizedTag.includes("oferta")) extraTagClass = "tag-promocao";
          tagHtml = `<span class="promo-tag-badge ${extraTagClass}">${product.Tag}</span>`;
        }

        // Preço De / Por
        const hasOldPrice = product.Preco_Antigo && product.Preco_Antigo !== "";
        const priceHtml = hasOldPrice
          ? `<div class="price-box">
               <span class="product-old-price">De R$ ${product.Preco_Antigo}</span>
               <span class="product-price has-discount">Por R$ ${product.Preco}</span>
             </div>`
          : `<div class="price-box">
               <span class="product-price">R$ ${product.Preco}</span>
             </div>`;

        card.innerHTML = `
          <div class="product-image-wrap">
            <img src="${product.Fotos[0]}" alt="${product.Nome}" loading="lazy" />
            <span class="mundo-badge mundo-${product.Mundo}">${mundoLabel}</span>
            ${tagHtml}
            ${hasMultiplePhotos ? `
              <button type="button" class="carousel-btn prev" aria-label="Foto anterior">‹</button>
              <button type="button" class="carousel-btn next" aria-label="Próxima foto">›</button>
              <span class="photo-counter">1 / ${product.Fotos.length}</span>
            ` : ''}
          </div>
          <div class="product-info">
            <h2 class="product-title">${product.Nome}</h2>
            ${priceHtml}
            <span class="sizes-label">Selecione o tamanho (riscado = lista de espera):</span>
            <div class="sizes-grid">${sizesHtml}</div>
            <button type="button" class="whatsapp-btn">
              Pedir no WhatsApp
            </button>
          </div>
        `;

        if (hasMultiplePhotos) {
          const imgEl = card.querySelector("img");
          const counterEl = card.querySelector(".photo-counter");

          card.querySelector(".prev").addEventListener("click", (e) => {
            e.stopPropagation();
            currentPhotoIndex = (currentPhotoIndex - 1 + product.Fotos.length) % product.Fotos.length;
            imgEl.src = product.Fotos[currentPhotoIndex];
            counterEl.textContent = `${currentPhotoIndex + 1} / ${product.Fotos.length}`;
          });

          card.querySelector(".next").addEventListener("click", (e) => {
            e.stopPropagation();
            currentPhotoIndex = (currentPhotoIndex + 1) % product.Fotos.length;
            imgEl.src = product.Fotos[currentPhotoIndex];
            counterEl.textContent = `${currentPhotoIndex + 1} / ${product.Fotos.length}`;
          });
        }

        let selectedSize = null;
        let selectedQty = 0;
        const sizeButtons = card.querySelectorAll(".size-btn");
        const orderBtn = card.querySelector(".whatsapp-btn");
        
        sizeButtons.forEach(btn => {
          btn.addEventListener("click", () => {
            sizeButtons.forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedSize = btn.getAttribute("data-size");
            selectedQty = parseInt(btn.getAttribute("data-qty")) || 0;

            if (selectedQty <= 0) {
              orderBtn.textContent = `Avise-me quando chegar (Tam. ${selectedSize})`;
              orderBtn.classList.add("notify-mode");
            } else {
              orderBtn.textContent = "Pedir no WhatsApp";
              orderBtn.classList.remove("notify-mode");
            }
          });
        });

        orderBtn.addEventListener("click", () => {
          if (!selectedSize) {
            alert("Por favor, selecione um tamanho antes de continuar!");
            return;
          }
          openLeadModal({
            mode: selectedQty <= 0 ? "notify" : "order",
            product: product,
            size: selectedSize
          });
        });

        grid.appendChild(card);
      });
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentMundo = btn.getAttribute("data-filter");
        renderCatalog();
      });
    });

    document.querySelectorAll(".size-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        document.querySelectorAll(".size-pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        currentSize = pill.getAttribute("data-size");
        renderCatalog();
      });
    });

    loadProducts();
  </script>
</body>
</html>
